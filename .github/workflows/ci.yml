name: Router monitor
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified application to Cloudflare
        type: boolean
        default: false
concurrency:
  group: nicx-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight && pnpm test && pnpm typecheck
      - run: sudo apt-get update && sudo apt-get install -y busybox-static cmake libjson-c-dev
      - run: sh scripts/build-test-jshn.sh "$RUNNER_TEMP/nicx-test-tools"
      - run: echo "NICX_TEST_STAGING=$RUNNER_TEMP/nicx-test-tools" >> "$GITHUB_ENV"
      - run: pnpm test:router
        env:
          NICX_BUSYBOX: /usr/bin/busybox
      - run: python3 tests/router/export_sample.py > "$RUNNER_TEMP/nicx-agent-fixture.json"
        env:
          NICX_BUSYBOX: /usr/bin/busybox
      - run: pnpm test:database
        env:
          NICX_AGENT_SAMPLE: ${{ runner.temp }}/nicx-agent-fixture.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: pnpm --filter @nicx/worker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
